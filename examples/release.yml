# Copy to an extension repository and adapt the build command.
name: Deploy Extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: Store to process
        type: choice
        options: [both, chrome, edge]
        default: both
      operation:
        description: Operation (status does not modify the stores)
        type: choice
        options: [status, upload, publish, deploy]
        default: status
      source-run-id:
        description: Original upload run (optional; matching upload is selected automatically)
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    uses: GreedyLabs/action-deploy-browser-extension/.github/workflows/deploy.yml@v2
    with:
      operation: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') && 'publish' || 'upload') || inputs.operation }}
      targets: ${{ inputs.targets != '' && inputs.targets != 'both' && inputs.targets || 'chrome, edge' }}
      source-run-id: ${{ inputs.source-run-id }}
      build-command: pnpm install --frozen-lockfile && pnpm run build:zip
      chrome-publisher-id: ${{ vars.CHROME_PUBLISHER_ID }}
      chrome-extension-id: ${{ vars.CHROME_EXTENSION_ID }}
      edge-product-id: ${{ vars.EDGE_PRODUCT_ID }}
    secrets:
      CHROME_SERVICE_ACCOUNT_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
